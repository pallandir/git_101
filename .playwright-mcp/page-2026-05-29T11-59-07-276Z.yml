          - paragraph [ref=e339]:
            - text: The reflog is
            - strong [ref=e340]: local to your machine
            - text: ", and it is a recovery tool for your own mistakes, not a backup of the remote. Entries also expire: reachable ones after"
            - strong [ref=e341]: 90 days
            - text: by default (
            - code [ref=e342]: gc.reflogExpire
            - text: ), and entries that are no longer reachable from any branch, which is exactly the lost-commit case above, after
            - strong [ref=e343]: 30 days
            - text: (
            - code [ref=e344]: gc.reflogExpireUnreachable
            - text: ). So the reflog can rescue you from a recent mistake, but don’t treat it as long-term storage.
