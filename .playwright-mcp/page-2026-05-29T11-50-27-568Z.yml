              - strong [ref=e343]: both
              - text: branches gained commits, Git performs a
              - strong [ref=e344]: three-way merge
              - text: and records a dedicated
              - strong [ref=e345]: merge commit
              - text: with two parents, tying the two lines of history together.
          - paragraph [ref=e346]: "Sometimes you want a merge commit even when a fast-forward would be possible, because it keeps a visible record of when a feature landed. Force one with:"
