              - img [ref=e182]
              - generic [ref=e184]: Section titled “Keeping a clean commit history”
          - paragraph [ref=e185]: A clean history is one you can actually read and reason about. You don’t need to be obsessive, but a few habits make a big difference.
          - paragraph [ref=e186]:
            - strong [ref=e187]: Commit small and often, then tidy before sharing.
            - text: While you work, commit freely, even messy “wip” commits. Before you push or open a pull request, use the interactive rebase from
            - link "Chapter 8" [ref=e188] [cursor=pointer]:
              - /url: /git-primer/advanced-commands/
            - text: "to squash the noise into meaningful commits:"
