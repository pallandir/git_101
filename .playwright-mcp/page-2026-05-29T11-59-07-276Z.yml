          - paragraph [ref=e273]: Neither is “correct,” it’s a team preference. Many teams rebase their feature branches to stay current, then merge into main.
          - generic [ref=e274]:
            - heading "Reflog and recovering lost commits (git reflog)" [level=2] [ref=e275]
