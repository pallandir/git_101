          - paragraph [ref=e334]:
            - text: How a merge looks depends on whether
            - code [ref=e335]: main
            - text: "moved on while you worked:"
          - list [ref=e336]:
            - listitem [ref=e337]:
              - text: If
              - code [ref=e338]: main
              - text: has
              - strong [ref=e339]: no new commits
              - text: since you branched, Git just slides the
              - code [ref=e340]: main
              - text: pointer forward to your branch tip. This is a
              - strong [ref=e341]: fast-forward
              - text: ": no extra commit, perfectly linear history."
            - listitem [ref=e342]:
