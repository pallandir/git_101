          - paragraph [ref=e366]:
            - text: A merge conflict happens when two branches changed the
            - strong [ref=e367]: same lines of the same file
            - text: in different ways, and Git cannot decide on its own which version to keep. This is not an error you did something wrong, it’s just Git asking for your help to make a decision.
