              - img [ref=e316]
              - generic [ref=e318]: Section titled “Git Flow”
          - paragraph [ref=e319]: "A more structured model designed for projects with scheduled releases and multiple versions in the wild. It uses several long-lived branches with strict roles:"
          - list [ref=e320]:
            - listitem [ref=e321]:
              - code [ref=e322]: main
