              - row "Effect Discards local file changes Moves the branch pointer back and erases commits Creates a new commit that undoes changes" [ref=e500]:
                - cell "Effect" [ref=e501]:
                  - strong [ref=e502]: Effect
                - cell "Discards local file changes" [ref=e503]
                - cell "Moves the branch pointer back and erases commits" [ref=e504]
                - cell "Creates a new commit that undoes changes" [ref=e505]
              - row "History rewrite No (history untouched) Yes (destructive) No (safe)" [ref=e506]:
