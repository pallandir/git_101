      - generic [ref=e115]:
        - generic [ref=e116]:
          - generic [ref=e117]:
            - heading "Git Best Practices" [level=2] [ref=e118]
            - link "Section titled “Git Best Practices”" [ref=e119] [cursor=pointer]:
