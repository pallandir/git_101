            - text: Undoing a public commit should add a new commit, not rewrite what others have already pulled.
          - generic [ref=e249]:
            - heading "Git workflows (Git Flow, Trunk-based, GitHub Flow)" [level=2] [ref=e250]
            - link "Section titled “Git workflows (Git Flow, Trunk-based, GitHub Flow)”" [ref=e251] [cursor=pointer]:
