          - generic [ref=e179]:
            - heading "Basic Git configuration (git config)" [level=2] [ref=e180]
            - link "Section titled “Basic Git configuration (git config)”" [ref=e181] [cursor=pointer]:
              - /url: "#basic-git-configuration-git-config"
              - img [ref=e183]
              - generic [ref=e185]: Section titled “Basic Git configuration (git config)”
          - paragraph [ref=e186]: When starting a new project with Git, you need to configure some general information. This information will be used for every commit and any operation that requires an author as metadata.
          - paragraph [ref=e187]: "To configure your user details in Git, run the following commands:"
          - figure "Terminal window" [ref=e189]:
            - generic [ref=e192]: Terminal window
            - code [ref=e194]:
              - generic [ref=e196]: "# Set your name"
              - generic [ref=e198]: git config --global user.name "firstname lastname"
              - generic [ref=e202]: "# Set your email"
              - generic [ref=e204]: git config --global user.email "your email"
            - button "Copy to clipboard" [ref=e206] [cursor=pointer]
          - paragraph [ref=e208]:
            - text: These settings are stored globally, meaning they apply to all repositories on your system. If you want to set them for a specific repository only, omit the
            - code [ref=e209]: "--global"
            - text: "flag:"
