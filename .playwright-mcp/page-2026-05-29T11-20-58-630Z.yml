          - paragraph [ref=e477]: "Here is one of the most useful mental models for Git: a commit behaves a lot like a block in a blockchain."
          - paragraph [ref=e478]:
            - text: "Every commit’s hash is computed from its content: its tree (the snapshot), its author, its message, and, crucially,"
            - strong [ref=e479]: the hash of its parent commit
            - text: . Because the parent’s hash is baked into the child, the commits form a tamper-evident chain. Change anything in an old commit and its hash changes, which changes the “parent” recorded in the next commit, which changes that commit’s hash too, and so on, all the way to the tip.
          - paragraph [ref=e480]: "Try it yourself. Edit a message in an early block, or hit “Tamper with commit #0”, and watch the change re-hash down the chain:"
          - paragraph [ref=e481]: This is exactly why you cannot quietly rewrite shared history. The moment you change an old commit, every later commit gets a new hash, and anyone who already has the original chain will spot the mismatch.
          - blockquote [ref=e482]:
            - paragraph [ref=e483]:
              - text: 📖 The demo is simplified to keep the focus on the chaining. A real commit object has the form
              - code [ref=e484]: commit <size>\0tree <hash>\nparent <hash>\nauthor ...\ncommitter ...\n\n<message>
              - text: ", and that whole thing is what gets hashed. The principle is identical: the parent’s hash is part of what gets hashed, so history is cryptographically chained."
