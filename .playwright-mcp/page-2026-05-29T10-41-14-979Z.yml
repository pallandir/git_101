          - generic [ref=e524]:
            - heading "When to use each" [level=3] [ref=e525]
            - link "Section titled “When to use each”" [ref=e526] [cursor=pointer]:
              - /url: "#when-to-use-each"
              - img [ref=e528]
              - generic [ref=e530]: Section titled “When to use each”
          - list [ref=e531]:
            - listitem [ref=e532]:
              - text: Use
              - code [ref=e533]: git restore
              - text: (or
              - code [ref=e534]: git checkout <file>
              - text: ) when you just want to throw away uncommitted edits to a file.
            - listitem [ref=e535]:
              - text: Use
              - code [ref=e536]: git reset --hard
              - text: only when you haven’t shared your changes yet (e.g., fixing local commits before they leave your machine).
            - listitem [ref=e537]:
