              - generic [ref=e524]: Section titled “Fetching changes (git fetch)”
          - paragraph [ref=e525]: Synchronizing your local repository with the remote one is crucial in Git. It ensures that your changes are submitted to others, while also allowing you to pull in changes from other contributors to stay up-to-date with the latest version of your project. Now that you know how to push your changes, let’s cover how to fetch the changes made by others.
          - paragraph [ref=e526]:
            - text: Getting your branch up to date with the remote is really
            - strong [ref=e527]: two separate steps
            - text: ", and the important thing to understand is that"
            - code [ref=e528]: git fetch
            - text: "only does the first one:"
          - list [ref=e529]:
            - listitem [ref=e530]:
              - strong [ref=e531]: "Fetch:"
              - text: download the latest commits from the remote into your local repository, updating your remote-tracking branches (like
              - code [ref=e532]: origin/main
              - text: ). Your own branch and your files are left untouched.
            - listitem [ref=e533]:
              - strong [ref=e534]: "Merge:"
              - text: when you’re ready, merge those fetched commits into your active branch.
          - paragraph [ref=e535]:
            - text: Keeping them separate is exactly what makes
            - code [ref=e536]: fetch
            - text: "safe: you can download and inspect what changed before you let any of it touch your work. The most basic command to download updates is:"
          - figure "Terminal window" [ref=e538]:
            - generic [ref=e541]: Terminal window
            - code [ref=e543]:
              - generic [ref=e545]: git fetch origin <branch>
            - button "Copy to clipboard" [ref=e547] [cursor=pointer]
          - paragraph [ref=e549]: This command downloads the latest changes from the remote repository into your local machine without merging them. This allows you to inspect the updates before integrating them into your own work.
          - paragraph [ref=e550]: "Once you’re ready to merge the fetched content into your active branch, run:"
          - figure "Terminal window" [ref=e552]:
            - generic [ref=e555]: Terminal window
            - code [ref=e557]:
              - generic [ref=e559]: git merge origin/<branch-name>
            - button "Copy to clipboard" [ref=e561] [cursor=pointer]
          - paragraph [ref=e563]: This will bring in the updates from the remote branch and apply them to your current working branch. It’s always a good idea to make sure your working directory is clean (i.e., no uncommitted changes) before performing a merge to avoid conflicts.
          - generic [ref=e564]:
            - heading "Pulling updates (git pull)" [level=2] [ref=e565]
            - link "Section titled “Pulling updates (git pull)”" [ref=e566] [cursor=pointer]:
              - /url: "#pulling-updates-git-pull"
              - img [ref=e568]
              - generic [ref=e570]: Section titled “Pulling updates (git pull)”
          - paragraph [ref=e571]:
            - text: Once you’re comfortable with using
            - code [ref=e572]: git fetch
            - text: and
            - code [ref=e573]: git merge origin/<branch>
            - text: ", you might want a quicker way to perform both actions in one go, especially if you don’t need to inspect the code before merging it. The command you’re looking for is:"
          - figure "Terminal window" [ref=e575]:
            - generic [ref=e578]: Terminal window
            - code [ref=e580]:
              - generic [ref=e582]: git pull
            - button "Copy to clipboard" [ref=e584] [cursor=pointer]
          - paragraph [ref=e586]:
            - text: This command automatically fetches the latest content from the default remote (usually
            - code [ref=e587]: origin
            - text: ) and merges it into your active branch. It’s a convenient way to keep your local repository up-to-date without needing to manually run both commands.
          - paragraph [ref=e588]: "If you want to pull updates from a specific branch, you can use:"
          - figure "Terminal window" [ref=e590]:
            - generic [ref=e593]: Terminal window
            - code [ref=e595]:
              - generic [ref=e597]: git pull origin <branch>
            - button "Copy to clipboard" [ref=e599] [cursor=pointer]
          - paragraph [ref=e601]: This fetches and merges changes only from the specified branch on the remote repository into your current branch. It’s helpful when you want to stay synced with a particular branch rather than all branches.
          - generic [ref=e602]:
            - heading "Forking and contributing to open-source projects" [level=2] [ref=e603]
            - link "Section titled “Forking and contributing to open-source projects”" [ref=e604] [cursor=pointer]:
              - /url: "#forking-and-contributing-to-open-source-projects"
              - img [ref=e606]
              - generic [ref=e608]: Section titled “Forking and contributing to open-source projects”
          - paragraph [ref=e609]: Open-source projects are community-driven solutions designed to address a variety of problems, offering free-tier implementations that could range from extensions and software libraries to simple command-line tools. These projects rely on volunteers to help maintain, update, and fix them. Contributing to these projects is a great way to improve the software while giving back to the community.
          - paragraph [ref=e610]: At first, contributing to an open-source project might feel intimidating. After all, your code will be viewed by hundreds of people and used by even more. However, it’s not as difficult as it seems, and it’s an excellent opportunity to learn and connect with a community. Whether you decide to contribute because you’ve found a bug you want to fix or because you simply enjoy the project, the process is rewarding.
          - paragraph [ref=e611]: Before you start writing any code, there are a few steps you need to follow. This section will guide you through the setup process.
          - generic [ref=e612]:
            - heading "Contributor guidelines" [level=3] [ref=e613]
            - link "Section titled “Contributor guidelines”" [ref=e614] [cursor=pointer]:
              - /url: "#contributor-guidelines"
              - img [ref=e616]
              - generic [ref=e618]: Section titled “Contributor guidelines”
          - paragraph [ref=e619]:
            - text: Most open-source projects include a
            - code [ref=e620]: CONTRIBUTING.md
            - text: file. This document outlines the steps to get started as a contributor, including what tools to download, how to run the project locally, and any specific setup instructions. It’s important to read this file carefully, as it will provide the rules and guidelines you need to follow in order to contribute effectively.
          - paragraph [ref=e621]: Once you’ve reviewed the guidelines, you’ll need to create a copy of the repository in your Git hosting platform account, usually GitHub. This process is called “forking” the repository, and it allows you to make changes and submit pull requests (PRs) once you’ve addressed the issue you’re working on.
          - paragraph [ref=e622]:
            - text: "To fork a project on GitHub, refer to the official documentation:"
            - link "Forking a project" [ref=e623] [cursor=pointer]:
              - /url: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/working-with-forks/fork-a-repo
            - text: .
          - paragraph [ref=e624]: With your fork ready, you can now submit a pull request to the original project. Your fork will be referenced, and your code will be reviewed by other contributors. They’ll decide whether to approve or reject your changes for inclusion in the main repository.
          - paragraph [ref=e625]: Remember, contributing isn’t just about developing complex features. It can also include helping with documentation, answering questions in issues, or suggesting improvements. Every bit counts toward making the project better!
