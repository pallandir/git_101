          - paragraph [ref=e281]:
            - text: "Here’s a reassuring secret: in Git, it’s surprisingly hard to truly lose work. Even after a “bad” reset or a rebase gone wrong, your old commits usually still exist, they just aren’t reachable by any branch anymore. The"
            - strong [ref=e282]: reflog
            - text: is your safety net.
          - paragraph [ref=e283]:
            - text: The reflog records every move
            - code [ref=e284]: HEAD
