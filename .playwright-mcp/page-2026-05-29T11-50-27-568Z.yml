            - button "Copy to clipboard" [ref=e324] [cursor=pointer]
          - paragraph [ref=e326]: If the branches have diverged significantly, Git might encounter merge conflicts. In that case, you’ll need to manually resolve conflicts before completing the merge.
          - generic [ref=e327]:
            - heading "Fast-forward vs. merge commit" [level=3] [ref=e328]
            - link "Section titled “Fast-forward vs. merge commit”" [ref=e329] [cursor=pointer]:
