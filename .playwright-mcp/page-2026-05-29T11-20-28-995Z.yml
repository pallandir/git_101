              - generic [ref=e220]: git config user.name "firstname lastname"
              - generic [ref=e222]: git config user.email "your email"
            - button "Copy to clipboard" [ref=e224] [cursor=pointer]
          - paragraph [ref=e226]: "You can verify your configuration with:"
