              - img [ref=e121]
              - generic [ref=e123]: Section titled “Git Best Practices”
          - paragraph [ref=e124]: Knowing the commands is half the journey. The other half is using them in a way that keeps your project readable and your teammates happy. None of these practices are enforced by Git itself, they’re habits that separate a confusing repository from a pleasant one to work in.
          - generic [ref=e125]:
            - heading "Writing good commit messages" [level=2] [ref=e126]
            - link "Section titled “Writing good commit messages”" [ref=e127] [cursor=pointer]:
              - /url: "#writing-good-commit-messages"
              - img [ref=e129]
              - generic [ref=e131]: Section titled “Writing good commit messages”
          - paragraph [ref=e132]:
            - text: A commit message is a note to your future self and your teammates explaining
            - strong [ref=e133]: why
            - text: a change happened. Six months from now, “fix stuff” tells you nothing, while “Fix login redirect loop on expired sessions” tells you everything.
          - paragraph [ref=e134]: "A widely adopted structure looks like this:"
          - figure [ref=e136]:
            - code [ref=e138]:
              - generic [ref=e140]: "<type>: <short summary in the imperative mood>"
              - generic [ref=e144]: <optional longer body explaining the why, not the how>
            - button "Copy to clipboard" [ref=e146] [cursor=pointer]
          - paragraph [ref=e148]: "A few guidelines that consistently pay off:"
          - list [ref=e149]:
            - listitem [ref=e150]:
              - text: Write the summary in the
              - strong [ref=e151]: imperative mood
              - text: ": “Add”, “Fix”, “Remove”, as if completing the sentence “This commit will…”."
            - listitem [ref=e152]: Keep the summary line short (around 50 characters) and don’t end it with a period.
            - listitem [ref=e153]:
              - text: Use the body to explain
              - strong [ref=e154]: why
              - text: the change was needed, not to restate what the diff already shows.
            - listitem [ref=e155]: Make each commit one logical change. If you find yourself writing “and” in the summary, it might be two commits.
          - paragraph [ref=e156]:
            - text: Many teams adopt the
            - link "Conventional Commits" [ref=e157] [cursor=pointer]:
              - /url: https://www.conventionalcommits.org/
            - text: "format, which prefixes the summary with a type:"
          - figure [ref=e159]:
            - code [ref=e161]:
              - generic [ref=e163]: "feat: add password reset flow"
              - generic [ref=e165]: "fix: prevent crash when cart is empty"
              - generic [ref=e167]: "docs: update installation steps"
              - generic [ref=e169]: "refactor: extract validation into helper"
              - generic [ref=e171]: "chore: bump dependencies"
            - button "Copy to clipboard" [ref=e173] [cursor=pointer]
          - paragraph [ref=e175]:
            - text: "The payoff is real: tools can read these prefixes to automatically generate changelogs and decide version numbers. And as we saw in"
            - link "Chapter 9" [ref=e176] [cursor=pointer]:
              - /url: /git-primer/hooks-automation/
            - text: ", a"
            - code [ref=e177]: commit-msg
            - text: hook can gently enforce the format for you.
          - generic [ref=e178]:
            - heading "Keeping a clean commit history" [level=2] [ref=e179]
            - link "Section titled “Keeping a clean commit history”" [ref=e180] [cursor=pointer]:
