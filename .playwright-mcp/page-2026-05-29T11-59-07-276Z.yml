            - button "Copy to clipboard" [ref=e309] [cursor=pointer]
          - paragraph [ref=e311]:
            - text: Imagine you ran
            - code [ref=e312]: git reset --hard HEAD~1
            - text: and panicked because a commit vanished. You can see in the reflog exactly where
            - code [ref=e313]: HEAD
            - text: "was just before, and jump back to it:"
          - figure "Terminal window" [ref=e315]:
            - generic [ref=e318]: Terminal window
            - code [ref=e320]:
