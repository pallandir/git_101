            - button "Copy to clipboard" [ref=e324] [cursor=pointer]
          - paragraph [ref=e326]: "Or, if you’d rather bring the lost commit back as a new branch without touching your current one:"
          - figure "Terminal window" [ref=e328]:
            - generic [ref=e331]: Terminal window
            - code [ref=e333]:
              - generic [ref=e335]: git branch recovered 8f0cd01
