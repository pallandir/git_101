              - generic [ref=e255]: Section titled “Git workflows (Git Flow, Trunk-based, GitHub Flow)”
          - paragraph [ref=e256]: A workflow is the agreed-upon set of rules for how your team uses branches. There’s no single best one, the right choice depends on your team size and how often you release. Here are the three you’ll meet most often.
          - generic [ref=e257]:
