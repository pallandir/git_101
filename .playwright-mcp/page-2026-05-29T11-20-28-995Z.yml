    - main [ref=e110]:
      - heading "1. Introduction to Git" [level=1] [ref=e113]
      - generic [ref=e115]:
        - generic [ref=e116]:
          - generic [ref=e117]:
            - heading "What is Git? Why use it?" [level=2] [ref=e118]
            - link "Section titled “What is Git? Why use it?”" [ref=e119] [cursor=pointer]:
              - /url: "#what-is-git-why-use-it"
              - img [ref=e121]
              - generic [ref=e123]: Section titled “What is Git? Why use it?”
          - paragraph [ref=e124]:
            - text: Git is a powerful,
            - strong [ref=e125]: distributed
            - text: version control system designed to track changes in files and collaborate with others on projects.
            - strong [ref=e126]: Distributed
            - text: "is the key word: every clone is a full copy of the entire history, so you can commit, branch, and browse the past completely offline, with no central server to ask permission from. Whether it’s source code, articles, or entire project files, Git ensures that you can easily manage and revert changes over time."
          - paragraph [ref=e127]: "In any project, things are always evolving. Features are added, bugs are fixed, and sometimes mistakes happen. This is where Git becomes essential. It allows you to:"
          - list [ref=e128]:
            - listitem [ref=e129]:
              - strong [ref=e130]: "Track changes:"
              - text: Git records every change made to your files, creating a detailed history of modifications.
            - listitem [ref=e131]:
              - strong [ref=e132]: "Revert to previous versions:"
              - text: Need to fix a bug or recover a deleted file? Git allows you to easily go back in time to a previous state of the project.
            - listitem [ref=e133]:
              - strong [ref=e134]: "Collaborate with others:"
              - text: Git allows multiple people to work on the same project simultaneously without overwriting each other’s work.
          - paragraph [ref=e135]: While Git is primarily used through a command-line interface (CLI), which offers a robust set of tools, many graphical user interfaces (GUIs) have emerged to make Git more accessible for those who prefer visual tools.
          - paragraph [ref=e136]: Using Git ensures you can maintain a clean and organized history of your project, making it easier to track progress and avoid losing valuable work.
          - generic [ref=e137]:
            - heading "Difference between Git and GitHub or GitLab" [level=2] [ref=e138]
            - link "Section titled “Difference between Git and GitHub or GitLab”" [ref=e139] [cursor=pointer]:
              - /url: "#difference-between-git-and-github-or-gitlab"
              - img [ref=e141]
              - generic [ref=e143]: Section titled “Difference between Git and GitHub or GitLab”
          - paragraph [ref=e144]:
            - text: It’s important to distinguish Git from platforms like GitHub and GitLab.
            - strong [ref=e145]: Git is the tool
            - text: ;
            - strong [ref=e146]: GitHub and GitLab are hosting platforms built on top of it.
            - text: Git manages your project locally and enables distributed collaboration all on its own. GitHub and GitLab add a shared place to store repositories, plus pull requests, issues, and CI/CD around them.
          - application "Git the tool versus the platforms that host Git repositories" [ref=e150]:
            - generic [ref=e152]:
              - generic:
                - generic:
                  - img
          - paragraph [ref=e154]: These platforms provide centralized repositories to store and share your Git projects, collaborative tools for team communication and code reviews, and user-friendly interfaces to interact with Git. While GitHub or GitLab enhances your Git experience, they are not required to use Git, as Git can function independently, but these platforms need Git as their foundation.
          - paragraph [ref=e155]: "Combining Git with platforms like GitHub or GitLab offers several advantages: ease of sharing projects with teammates or the broader community, seamless team collaboration with task assignments and issue tracking, backup and accessibility of your projects from anywhere via remote repositories, and additional tools like CI/CD pipelines, code analysis, and deployment automation."
          - paragraph [ref=e156]: Git is the backbone of modern version control, enabling teams to work efficiently and safeguard their projects, while platforms like GitHub and GitLab extend Git’s capabilities by providing tools for collaboration, project management, and remote accessibility.
          - generic [ref=e157]:
            - heading "Installing Git (Windows, macOS, Linux)" [level=2] [ref=e158]
            - link "Section titled “Installing Git (Windows, macOS, Linux)”" [ref=e159] [cursor=pointer]:
