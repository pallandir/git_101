          - paragraph [ref=e301]: It’s easy to learn and fast, which is why most small-to-medium teams use it.
          - generic [ref=e302]:
            - heading "Trunk-based development" [level=3] [ref=e303]
            - link "Section titled “Trunk-based development”" [ref=e304] [cursor=pointer]:
              - /url: "#trunk-based-development"
              - img [ref=e306]
              - generic [ref=e308]: Section titled “Trunk-based development”
          - paragraph [ref=e309]:
            - text: A close cousin favored by teams that ship many times a day. Everyone integrates into
            - code [ref=e310]: main
            - text: (the “trunk”) very frequently, often through short-lived branches that live for hours, not days. Big or risky features hide behind
            - strong [ref=e311]: feature flags
            - text: rather than long-running branches. This keeps painful integration conflicts to a minimum, but it relies heavily on strong automated testing.
          - generic [ref=e312]:
            - heading "Git Flow" [level=3] [ref=e313]
            - link "Section titled “Git Flow”" [ref=e314] [cursor=pointer]:
